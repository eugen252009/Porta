services:
  porta:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Keep the standard development toolchains explicit and reproducible.
        GO_VERSION: "1.26.5"
        RUST_VERSION: "1.97.1"
    restart: unless-stopped
    init: true
    environment:
      PORTA_CONFIG: /config/porta.json
      PORTA_DATA_DIR: /data
      PORTA_WEB_PORT: 4173
    ports:
      # Keep the development node local by default.
      - "127.0.0.1:4173:4173"
    volumes:
      # The Docker-specific configuration is intentionally read-only.
      - ./porta.docker.json:/config/porta.json:ro
      - porta-data:/data
      - porta-workspace:/workspace

volumes:
  porta-data:
  porta-workspace:
