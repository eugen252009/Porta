<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Send to Porta settings</title><style>body{max-width:560px;margin:40px auto;padding:0 20px;font:15px system-ui;color:#e8edf2;background:#0d1117}label{display:grid;gap:6px;margin:18px 0;color:#9aaab5}input{padding:9px;border:1px solid #263340;border-radius:6px;color:#e8edf2;background:#131a22}button{padding:9px 14px;border:1px solid #91ddd4;border-radius:6px;background:#91ddd4;color:#101414;font-weight:600}#status{color:#91ddd4}</style></head><body><h1>Send to Porta</h1><p>Use a scoped integration credential. It is stored only in this extension profile.</p><label>Porta endpoint<input id="endpoint" type="url" placeholder="https://porta.home.arpa"></label><label>Integration credential<input id="token" type="password" autocomplete="off"></label><label>Default target (optional)<input id="defaultTarget" placeholder="pc-main"></label><button id="save">Save</button><p id="status" role="status"></p><script src="options.js"></script></body></html>
